tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'net.serenity-bdd.aggregator'

group 'co.com.veterinaria'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenLocal()
    mavenCentral()
    jcenter()
}

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        jcenter()
    }
    ext {
        serenityVersion = "2.1.1"
        serenityGradleVersion = "2.1.1"
        serenityCucumberVersion = "1.9.51"
    }
    dependencies {
        classpath("net.serenity-bdd:serenity-gradle-plugin:$serenityGradleVersion")
    }
}

dependencies {
    implementation group: 'org.slf4j', name: 'slf4j-simple', version: "1.7.30"
    implementation group: 'org.hamcrest', name: 'hamcrest', version: "2.2"
    
    implementation group: 'net.serenity-bdd', name: 'serenity-core', version: "$serenityVersion"
    implementation group: 'net.serenity-bdd', name: 'serenity-cucumber', version: "$serenityCucumberVersion"
    implementation group: 'net.serenity-bdd', name: 'serenity-junit', version: "$serenityVersion"
    implementation group: 'net.serenity-bdd', name: 'serenity-screenplay', version: "$serenityVersion"
    implementation group: 'net.serenity-bdd', name: 'serenity-screenplay-webdriver', version: "$serenityVersion"
    implementation group: 'net.serenity-bdd', name: 'serenity-screenplay-rest', version: "$serenityVersion"
    
    implementation group: 'com.jcraft', name: 'jsch', version: '0.1.55'
    implementation group: 'log4j', name: 'log4j', version: '1.2.17'
    implementation group: 'org.apache.poi', name: 'poi', version: '4.1.2'
    implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '4.1.2'
    implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.6.1'
}

test {
    useJUnit()
    systemProperty "cucumber.options", "--plugin pretty"
    testLogging.showStandardStreams = true
    finalizedBy 'aggregate'
}

tasks.withType(Test) {
    scanForTestClasses = false
    include "**/*Runner.class"
}
